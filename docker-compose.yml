version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: orion-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  orchestrator:
    build: ./orquestrate
    container_name: orion-orchestrator
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 9080
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      GN_ID: ${GN_ID}
      GN_USERNAME: ${GN_USERNAME}
      GN_PASSWORD: ${GN_PASSWORD}
      GN_API_BASE: ${GN_API_BASE}
    ports:
      - "9080:9080"
    depends_on:
      - ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: orion-backend
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL}
      ORCHESTRATOR_TIMEOUT: ${ORCHESTRATOR_TIMEOUT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: orion-frontend
    ports:
      - "4173:4173"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: orion-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data: